<header class="sticky top-0 z-50 bg-white border-b-2 border-purple-200 shadow-planova-md">
  <nav class="container-max">
    <div class="flex-between h-20 px-4">

      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="h-12 w-12 flex-center bg-gradient-planova rounded-lg shadow-md hover:shadow-lg transition-all duration-300 hover:scale-110">
          <svg class="h-7 w-7 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z"></path>
          </svg>
        </div>
        <div class="hidden sm:block">
          <h1 class="text-2xl font-bold text-gradient">Planova</h1>
          <p class="text-xs text-gray-500">Planification Intelligente</p>
        </div>
      </div>

      <!-- Navigation Desktop -->
      <nav class="hidden lg:flex items-center gap-8">
        <a href="#" class="link-primary font-semibold hover:text-purple-700">Tableau de bord</a>
        <a href="#" class="link-primary font-semibold hover:text-purple-700">Projets</a>
        <a href="#" class="link-primary font-semibold hover:text-purple-700">Équipe</a>
        <a href="#" class="link-primary font-semibold hover:text-purple-700">Paramètres</a>
      </nav>

      <!-- Dropdown Profile -->
      <div class="relative group">
        <button
          (click)="toggleDropdown()"
          class="flex-between gap-3 px-4 py-2 rounded-xl bg-gradient-to-r from-purple-50 to-blue-50 hover:from-purple-100 hover:to-blue-100 border-2 border-purple-200 transition-all duration-300">

          <div class="h-10 w-10 flex-center bg-gradient-planova rounded-lg overflow-hidden shadow-md">
            <img [src]="userAvatar" alt="{{ userName }}" class="h-full w-full object-cover">
          </div>

          <div class="hidden sm:block text-left">
            <p class="text-sm font-bold text-gray-900">{{ userName }}</p>
            <p class="text-xs text-gray-500">Admin</p>
          </div>

          <svg
            [class.rotate-180]="isDropdownOpen"
            class="h-5 w-5 text-purple-600 transition-transform duration-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
          </svg>
        </button>

        <!-- Dropdown Menu avec animation Tailwind -->
        <div
          *ngIf="isDropdownOpen"
          (mouseleave)="closeDropdown()"
          class="absolute right-0 mt-3 w-64 bg-white rounded-xl shadow-planova-lg border-2 border-purple-100 overflow-hidden
                 animate-in fade-in slide-in-from-top-2 duration-200">

          <div class="bg-gradient-planova p-4 text-white">
            <p class="text-sm font-bold">{{ userName }}</p>
            <p class="text-xs text-purple-100">{{ userEmail }}</p>
            <div class="mt-3 flex gap-2">
              <span class="badge badge-blue">Premium</span>
              <span class="badge badge-success">Actif</span>
            </div>
          </div>

          <div class="h-px bg-gradient-to-r from-transparent via-purple-200 to-transparent"></div>

          <div class="py-2">
            <button
              (click)="goToProfile()"
              class="w-full flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-purple-50 transition-colors duration-200 text-sm font-medium">
              <svg class="h-5 w-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <span>Mon Profil</span>
            </button>

            <button
              (click)="goToSettings()"
              class="w-full flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-purple-50 transition-colors duration-200 text-sm font-medium">
              <svg class="h-5 w-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              </svg>
              <span>Paramètres</span>
            </button>

            <div class="h-px bg-gradient-to-r from-transparent via-purple-200 to-transparent my-2"></div>

            <button
              (click)="logout()"
              class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 transition-colors duration-200 text-sm font-bold">
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
              <span>Déconnexion</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
