<div class="relative h-96 md:h-96 lg:h-[500px] bg-gradient-planova rounded-2xl overflow-hidden shadow-planova-lg group">

  <!-- Slides Container -->
  <div class="absolute inset-0">
    @for (slide of slides; track slide.id; let i = $index) {
      <div
        [class]="currentSlide === i ? 'opacity-100' : 'opacity-0'"
        class="absolute inset-0 transition-opacity duration-1000 ease-in-out">

        <div class="h-full flex items-center justify-between px-8 md:px-12 relative z-10">
          <!-- Contenu texte -->
          <div class="flex-1 text-white max-w-md">
            <h1 class="text-4xl md:text-5xl font-black mb-4 leading-tight animate-fade-in-up">
              {{ slide.title }}
            </h1>
            <p class="text-lg md:text-xl text-purple-100 mb-8 leading-relaxed">
              {{ slide.subtitle }}
            </p>
            <button class="btn btn-lg bg-white text-purple-700 hover:shadow-lg font-bold transform transition-transform hover:scale-105">
              {{ slide.cta }}
            </button>
          </div>

          <!-- Image -->
          <div class="hidden lg:flex flex-1 items-center justify-center">
            <div class="relative">
              <div class="absolute inset-0 bg-white/10 rounded-full blur-3xl"></div>
              <img [src]="slide.image"
                   alt="{{ slide.title }}"
                   class="relative h-72 w-72 object-cover rounded-2xl filter drop-shadow-lg animate-float">
            </div>
          </div>
        </div>

        <!-- Gradient Overlay -->
        <div class="absolute inset-0 bg-gradient-to-r from-purple-900/30 via-transparent to-transparent"></div>
      </div>
    }
  </div>

  <!-- Navigation Buttons -->
  <button (click)="prevSlide()"
          class="absolute left-6 top-1/2 -translate-y-1/2 z-20 bg-white/20 hover:bg-white/40 backdrop-blur-md text-white p-3 rounded-full transition-all duration-300 hover:scale-110 border border-white/20 group/nav">
    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
    </svg>
  </button>

  <button (click)="nextSlide()"
          class="absolute right-6 top-1/2 -translate-y-1/2 z-20 bg-white/20 hover:bg-white/40 backdrop-blur-md text-white p-3 rounded-full transition-all duration-300 hover:scale-110 border border-white/20 group/nav">
    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
    </svg>
  </button>

  <!-- Dots Navigation -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex gap-2">
    @for (slide of slides; track slide.id; let i = $index) {
      <button
        (click)="goToSlide(i)"
        [class]="currentSlide === i
          ? 'h-3 w-8 bg-white rounded-full transition-all duration-500 backdrop-blur-sm border border-white/30'
          : 'h-3 w-3 bg-white/50 rounded-full transition-all duration-500 backdrop-blur-sm border border-white/30'">
      </button>
    }
  </div>

  <!-- Info Counter -->
  <div class="absolute top-6 right-6 z-20 bg-white/20 backdrop-blur-md rounded-full px-4 py-2 border border-white/20 text-white text-sm font-semibold">
    {{ currentSlide + 1 }} / {{ slides.length }}
  </div>
</div>
